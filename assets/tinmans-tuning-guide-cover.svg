<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="900" viewBox="0 0 1600 900" role="img"
     aria-labelledby="cover-title cover-description">
  <title id="cover-title">Tinmans Tuning Guide</title>
  <desc id="cover-description">A bright editorial Tinman cover with the mascot, calibration rings, and a red brand arc.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#edf7f4"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f2ec"/><stop offset="0.58" stop-color="#b5dfd8"/><stop offset="1" stop-color="#a8ced4"/>
    </linearGradient>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#31545a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="18" height="900" fill="#ed2f3c"/>
  <circle cx="1272" cy="450" r="520" fill="url(#orb)"/>
  <circle cx="1272" cy="450" r="408" fill="none" stroke="#188f88" stroke-width="3" stroke-opacity="0.52"/>
  <circle cx="1272" cy="450" r="336" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.52"/>
  <path d="M 842 158 A 510 510 0 0 1 1538 219" fill="none" stroke="#ed2f3c" stroke-width="18" stroke-linecap="round"/>
  <path d="M 918 760 A 494 494 0 0 0 1513 699" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.86"/>
  <g fill="none" stroke="#164f57" stroke-opacity="0.22" stroke-width="3">
    <path d="M 817 298 H 982"/><path d="M 788 337 H 909"/><path d="M 812 376 H 871"/>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="128" y="190" fill="#17323a" font-size="34" font-weight="700" letter-spacing="8">TINMAN</text>
    <text x="122" y="360" fill="#17323a" font-size="124" font-weight="750" letter-spacing="-4">TUNING</text>
    <text x="122" y="482" fill="#17323a" font-size="124" font-weight="750" letter-spacing="-4">GUIDE</text>
    <text x="130" y="568" fill="#4d676d" font-size="27" letter-spacing="2.4">FILAMENT CALIBRATION, DIAGNOSIS</text>
    <text x="130" y="610" fill="#4d676d" font-size="27" letter-spacing="2.4">AND REPEATABLE PROFILE RELEASE</text>
    <text x="130" y="814" fill="#188f88" font-size="24" font-weight="700" letter-spacing="3.2">TINMAN-FP · FIELD GUIDE SERIES</text>
  </g>
  <g transform="translate(1074 252)" filter="url(#mark-shadow)">
    <rect width="396" height="396" rx="92" fill="#ffffff" fill-opacity="0.88" stroke="#ffffff" stroke-width="12"/>
    <image x="26" y="26" width="344" height="344" xlink:href="tinmanx1-thumbnail-logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
