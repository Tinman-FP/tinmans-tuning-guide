<g class="num"><text x="90" y="658">1</text><text x="575" y="163">2</text><text x="240" y="218">3</text><text x="675" y="358">4</text><text x="350" y="673">5</text></g>
<text x="770" y="168" class="label">1  Hull and symmetry</text>
<text x="770" y="203" class="body">Continuous walls; compare both sides.</text>
<text x="770" y="257" class="label">2  Chimney</text>
<text x="770" y="292" class="body">Round bore, coherent cylinder, flat top.</text>
<text x="770" y="346" class="label">3  Cabin and roof</text>
<text x="770" y="381" class="body">Inspect bridges and interior overhangs.</text>
<text x="770" y="416" class="body">Regular shallow-slope steps are normal;</text>
<text x="770" y="451" class="body">missing tracks and open bands are not.</text>
<text x="770" y="505" class="label">4  Deck, cargo and openings</text>
<text x="770" y="540" class="body">Flat faces; clear holes; resolved details.</text>
<text x="770" y="594" class="label">5  Bottom and stern</text>
<text x="770" y="629" class="body">First-layer letters; note removal damage.</text>
<text x="50" y="728" class="note">Record each feature: observed acceptable / defective / not assessed. Photos do not establish strength or dimensions.</text>
<text x="50" y="764" class="note">Original schematic: Codex/OpenAI for William Tinney, CC BY 4.0. Feature basis: 3DBenchy.com/features/.</text>
</svg>
