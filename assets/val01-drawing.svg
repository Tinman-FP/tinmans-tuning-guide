<text class="d" x="830" y="664">Overall 70 × 85 × 38 mm (bracket and coupon on one plate).</text>
<text class="d" x="830" y="692">Two 40 mm bridges: the channel deck (4 mm solid deck,</text>
<text class="d" x="830" y="720">carrying the boss) and the window lintel.</text>
<text class="d" x="830" y="748">Hidden line: channel under the deck, open at the front.</text>
<text class="d" x="830" y="776">Pin clearances on Ø8.0 holes: 0.1, 0.2, 0.3, 0.4 mm.</text>
<text class="d" x="830" y="804">45° gussets, 4 thick, rise to height 28.</text>
<text class="d" x="830" y="832">Print without supports; change only the label.</text>
<text class="d" x="830" y="860">Limits in chapter 09 were written for a 0.4 mm nozzle</text>
<text class="d" x="830" y="888">and 0.20 mm layers.</text>
