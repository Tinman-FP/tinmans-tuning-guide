<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1275" height="1650" viewBox="0 0 1275 1650" role="img"
     aria-labelledby="cover-title cover-description">
  <title id="cover-title">Tinmans Tuning Guide PDF cover</title>
  <desc id="cover-description">Portrait Airframe cover for the printer-neutral Tinman tuning handbook.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#edf7f4"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f2ec"/><stop offset="0.58" stop-color="#b5dfd8"/><stop offset="1" stop-color="#a8ced4"/>
    </linearGradient>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#31545a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1275" height="1650" fill="url(#paper)"/>
  <rect width="22" height="1650" fill="#ed2f3c"/>
  <circle cx="866" cy="1000" r="598" fill="url(#orb)"/>
  <circle cx="866" cy="1000" r="472" fill="none" stroke="#188f88" stroke-width="4" stroke-opacity="0.5"/>
  <circle cx="866" cy="1000" r="382" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.62"/>
  <path d="M 343 765 A 620 620 0 0 1 1194 841" fill="none" stroke="#ed2f3c" stroke-width="22" stroke-linecap="round"/>
  <path d="M 443 1405 A 590 590 0 0 0 1151 1321" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.88"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="104" y="156" fill="#17323a" font-size="38" font-weight="700" letter-spacing="9">TINMAN</text>
    <text x="96" y="326" fill="#17323a" font-size="132" font-weight="750" letter-spacing="-4">TUNING</text>
    <text x="96" y="454" fill="#17323a" font-size="132" font-weight="750" letter-spacing="-4">GUIDE</text>
    <text x="104" y="535" fill="#4d676d" font-size="27" letter-spacing="2.2">FILAMENT CALIBRATION, DIAGNOSIS</text>
    <text x="104" y="577" fill="#4d676d" font-size="27" letter-spacing="2.2">AND REPEATABLE PROFILE RELEASE</text>
    <text x="104" y="1552" fill="#188f88" font-size="24" font-weight="700" letter-spacing="3.2">TINMAN-FP · FIELD GUIDE SERIES</text>
  </g>
  <g transform="translate(596 745)" filter="url(#mark-shadow)">
    <rect width="540" height="540" rx="126" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="14"/>
    <image x="36" y="36" width="468" height="468" xlink:href="tinmanx1-thumbnail-logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
